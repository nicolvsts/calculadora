    }

    angleIndicator.addEventListener('click', toggleAngleMode);

    // =========================================================
    // NAVEGACIÓN PERSONALIZADA CON FLECHAS Y TAB EN INTEGRALES DEFINIDAS
    // (\int_{inf}^{sup} integrando \, \mathrm{d}var)
    // =========================================================
    function isDiffSymbolAtom(atom) {
      return Boolean(
        atom && (atom.value === 'd' || atom.command === '\\mathrm{d}' || atom.command === '\\differentialD')
      );
    }

    function setModelCursor(model, offset) {
      model.setPositionHandlingPlaceholder(offset);
      mf.selection = model.selection;
      focusEntryBar();
      if (typeof scheduleUpdateActiveIntegralPill === 'function') {
        scheduleUpdateActiveIntegralPill();
      } else if (typeof requestAnimationFrame === 'function' && typeof updateActiveIntegralPill === 'function') {
        requestAnimationFrame(updateActiveIntegralPill);
      }
    }

    function focusIntegralBranch(model, branch, edge = 'end') {
      if (!Array.isArray(branch) || branch.length === 0) return false;
      const ph = branch.find((a) => a && a.type === 'placeholder');
      if (ph) {
        setModelCursor(model, model.offsetOf(ph));
        return true;
      }
      const target =
        edge === 'start'
          ? (branch.length > 1 && isDiffSymbolAtom(branch[1]) ? branch[1] : branch[0])
          : branch[branch.length - 1];
      setModelCursor(model, model.offsetOf(target));
      return true;
    }

    function isAtomInside(atom, containerAtom) {
      let n = atom ? atom.parent : null;
      while (n) {
        if (n === containerAtom) return true;
        n = n.parent;
      }
      return false;
    }

    function locateIntegralBoxes(intAtom) {
      let integrandBox = null;
      let diffBox = null;
      if (!intAtom) return { integrandBox, diffBox };
      let check = intAtom.rightSibling;
      while (check) {
        if (check.type === 'box') {
          if (!integrandBox) {
            integrandBox = check;
          } else if (!diffBox) {
            diffBox = check;
            break;
          }
        } else if (isDiffSymbolAtom(check)) {
          let afterD = check.rightSibling;
          while (afterD && afterD.type === 'spacing') afterD = afterD.rightSibling;
          if (afterD && afterD.type === 'box') {
            diffBox = afterD;
          }
          break;
        } else if (integrandBox && check.type !== 'spacing') {
          break;
        }
        check = check.rightSibling;
      }
      return { integrandBox, diffBox };
    }

    function findIntegralContext(curAtom, model) {
      if (!curAtom) {
        return { intAtom: null, integrandBox: null, diffBox: null, inSubscript: false, inSuperscript: false, isIntegrand: false, inDiff: false };
      }
      let node = curAtom;
      let inSubscript = false;
      let inSuperscript = false;
      let intAtom = null;

      // 1. Verificar si estamos dentro de subscript o superscript de \int
      while (node) {
        if (node.parent && node.parent.command === '\\int') {
          intAtom = node.parent;
          if (node.parentBranch === 'subscript') inSubscript = true;
          if (node.parentBranch === 'superscript') inSuperscript = true;
          break;
        }
        node = node.parent;
      }

      if (intAtom) {
        const { integrandBox, diffBox } = locateIntegralBoxes(intAtom);
        return { intAtom, integrandBox, diffBox, inSubscript, inSuperscript, isIntegrand: false, inDiff: false };
      }

      // 2. Buscar en cualquier nivel contenedor si estamos dentro del integrando o del diferencial de un \int
      if (model) {
        let n = curAtom;
        while (n) {
          let sib = n.leftSibling;
          let foundInt = null;
          while (sib) {
            if (sib.command === '\\int') {
              foundInt = sib;
              break;
            }
            sib = sib.leftSibling;
          }
          if (foundInt) {
            const { integrandBox, diffBox } = locateIntegralBoxes(foundInt);
            if (diffBox && (isAtomInside(curAtom, diffBox) || (diffBox === n && curAtom !== diffBox))) {
              return { intAtom: foundInt, integrandBox, diffBox, inSubscript: false, inSuperscript: false, isIntegrand: false, inDiff: true };
            }
            if (integrandBox && (isAtomInside(curAtom, integrandBox) || (integrandBox === n && curAtom !== integrandBox))) {
              return { intAtom: foundInt, integrandBox, diffBox, inSubscript: false, inSuperscript: false, isIntegrand: true, inDiff: false };
            }
            if (!integrandBox && !diffBox) {
              let passedD = false;
              let check = foundInt.rightSibling;
              while (check && check !== n) {
                if (isDiffSymbolAtom(check)) {
                  passedD = true;
                  break;
                }
                check = check.rightSibling;
              }
              if (!passedD && !isDiffSymbolAtom(n)) {
                return { intAtom: foundInt, integrandBox: null, diffBox: null, inSubscript: false, inSuperscript: false, isIntegrand: true, inDiff: false };
              }
            } else if (n === foundInt) {
              return { intAtom: foundInt, integrandBox, diffBox, inSubscript: false, inSuperscript: false, isIntegrand: true, inDiff: false };
            }
          }
          if (n.parent === model.root) break;
          n = n.parent;
        }
      }

      return { intAtom: null, integrandBox: null, diffBox: null, inSubscript: false, inSuperscript: false, isIntegrand: false, inDiff: false };
    }

    function tryIntegralTabNav(forward = true) {
      if (modalNav.isOpen || selectedHistoryIndex !== -1) return false;
      const model = mf && mf._mathfield && mf._mathfield.model;
      if (!model) return false;

      const curAtom = model.at(model.position);
      if (!curAtom) return false;

      const { intAtom, integrandBox, diffBox, inSubscript, inSuperscript, isIntegrand, inDiff } = findIntegralContext(curAtom, model);
      if (!intAtom) return false;

      if (forward) {
        // 1. Desde límite inferior (subscript) -> siguiente placeholder o límite superior
        if (inSubscript) {
          const nextSubPh = findAdjacentPlaceholder(model, intAtom.subscript, true);
          if (nextSubPh) {
            setModelCursor(model, model.offsetOf(nextSubPh));
            return true;
          }
          if (intAtom.superscript) {
            return focusIntegralBranch(model, intAtom.superscript, 'end');
          }
        }
        // 2. Desde límite superior (superscript) -> siguiente placeholder o recuadro del integrando
        if (inSuperscript) {
          const nextSupPh = findAdjacentPlaceholder(model, intAtom.superscript, true);
          if (nextSupPh) {
            setModelCursor(model, model.offsetOf(nextSupPh));
            return true;
          }
          if (integrandBox && Array.isArray(integrandBox.body)) {
            return focusIntegralBranch(model, integrandBox.body, 'end');
          }
          const integrandAtom = intAtom.rightSibling;
          if (integrandAtom) {
            if (integrandAtom.type === 'placeholder') {
              setModelCursor(model, model.offsetOf(integrandAtom));
              return true;
            }
            setModelCursor(model, model.offsetOf(intAtom));
            return true;
          }
        }
        // 3. Desde recuadro del integrando -> saltar al recuadro del diferencial \mathrm{d}[...]
        if (isIntegrand && integrandBox && Array.isArray(integrandBox.body)) {
          const nextIntPh = findAdjacentPlaceholder(model, integrandBox.body, true);
          if (nextIntPh) {
            setModelCursor(model, model.offsetOf(nextIntPh));
            return true;
          }
          const p = curAtom.parent;
          const br = curAtom.parentBranch;
          if (
            p &&
            p !== integrandBox &&
            ((p.type === 'genfrac' && br === 'above' && p.below) ||
              (p.type === 'surd' && br === 'above' && p.body) ||
              ((br === 'subscript' || br === 'below') && p.superscript))
          ) {
            return false;
          }
          if (diffBox && Array.isArray(diffBox.body)) {
            return focusIntegralBranch(model, diffBox.body, 'end');
          }
        }
        // 4. Desde recuadro del diferencial -> salir justo a la derecha de la integral
        if (inDiff && diffBox) {
          const nextDiffPh = findAdjacentPlaceholder(model, diffBox.body, true);
          if (nextDiffPh) {
            setModelCursor(model, model.offsetOf(nextDiffPh));
            return true;
          }
          setModelCursor(model, model.offsetOf(diffBox));
          return true;
        }
      } else {
        // En reversa (Ctrl+Tab / Shift+Tab):
        if (inDiff) {
          const prevDiffPh = findAdjacentPlaceholder(model, diffBox?.body, false);
          if (prevDiffPh) {
            setModelCursor(model, model.offsetOf(prevDiffPh));
            return true;
          }
          if (integrandBox && Array.isArray(integrandBox.body)) {
            return focusIntegralBranch(model, integrandBox.body, 'end');
          }
        }
        if (isIntegrand) {
          const prevIntPh = integrandBox ? findAdjacentPlaceholder(model, integrandBox.body, false) : null;
          if (prevIntPh) {
            setModelCursor(model, model.offsetOf(prevIntPh));
            return true;
          }
          if (intAtom.superscript) {
            return focusIntegralBranch(model, intAtom.superscript, 'end');
          }
          const beforeOffset = intAtom.leftSibling ? model.offsetOf(intAtom.leftSibling) : 0;
          setModelCursor(model, Math.max(0, beforeOffset));
          return true;
        }
        if (inSuperscript && intAtom.subscript) {
          const prevSupPh = findAdjacentPlaceholder(model, intAtom.superscript, false);
          if (prevSupPh) {
            setModelCursor(model, model.offsetOf(prevSupPh));
            return true;
          }
          return focusIntegralBranch(model, intAtom.subscript, 'end');
        }
      }

      return false;
    }

    function collectSubtreePlaceholders(atomsList, out = []) {
      if (!Array.isArray(atomsList)) return out;
      for (const atom of atomsList) {
        if (!atom || atom.type === 'first') continue;
        if (atom.type === 'placeholder') {
          out.push(atom);
        }
        if (Array.isArray(atom.subscript)) collectSubtreePlaceholders(atom.subscript, out);
        if (Array.isArray(atom.superscript)) collectSubtreePlaceholders(atom.superscript, out);
        if (Array.isArray(atom.below)) collectSubtreePlaceholders(atom.below, out);
        if (Array.isArray(atom.above)) collectSubtreePlaceholders(atom.above, out);
        if (Array.isArray(atom.body)) collectSubtreePlaceholders(atom.body, out);
        if (Array.isArray(atom.array)) {
          for (const row of atom.array) {
            if (!Array.isArray(row)) continue;
            for (const cell of row) {
              collectSubtreePlaceholders(cell, out);
            }
          }
        }
      }
      return out;
    }

    function findAdjacentPlaceholder(model, atomsList, forward = true) {
      const phs = collectSubtreePlaceholders(atomsList);
      if (phs.length === 0) return null;
      const maxPos = Math.max(model.anchor, model.position);
      const minPos = Math.min(model.anchor, model.position);
      const currentSelPh = model.selectionIsPlaceholder ? model.at(maxPos) : null;
      if (forward) {
        return phs.find((ph) => model.offsetOf(ph) > maxPos) || null;
      }
      const bound = currentSelPh ? maxPos : minPos;
      for (let i = phs.length - 1; i >= 0; i--) {
        const ph = phs[i];
        if (ph !== currentSelPh && model.offsetOf(ph) < bound) return ph;
      }
      return null;
    }

    function getBranchAtoms(parent, branchName) {
      if (!parent) return null;
      if (Array.isArray(branchName) && parent.type === 'array' && typeof parent.getCell === 'function') {
        return parent.getCell(branchName[0], branchName[1]);
      }
      if (typeof branchName === 'string' && Array.isArray(parent[branchName])) {
        return parent[branchName];
      }
      return null;
    }

    function handleMathTabNav(forward = true) {
      if (modalNav.isOpen || selectedHistoryIndex !== -1) return false;
      focusEntryBar();

      if (tryIntegralTabNav(forward)) return true;

      const model = mf && mf._mathfield && mf._mathfield.model;
      if (!model) return false;

      const curOffset = model.position;
      const curAtom = model.at(curOffset);
      if (!curAtom) return false;

      const parent = curAtom.parent;
      const branchName = curAtom.parentBranch;

      if (parent && parent !== model.root) {
        // Caso Matriz ('array'): recorrer celda por celda o salir tras la última celda
        if (parent.type === 'array' && Array.isArray(branchName)) {
          const [r, c] = branchName;
          const curCell = parent.getCell(r, c);
          const nextCellPh = findAdjacentPlaceholder(model, curCell, forward);
          if (nextCellPh) {
            setModelCursor(model, model.offsetOf(nextCellPh));
            return true;
          }
          const rows = parent.rowCount || (parent.array ? parent.array.length : 0);
          const cols = parent.colCount || (parent.array && parent.array[r] ? parent.array[r].length : 0);
          if (forward) {
            if (c + 1 < cols) {
              return focusIntegralBranch(model, parent.getCell(r, c + 1), 'end');
            }
            if (r + 1 < rows) {
              return focusIntegralBranch(model, parent.getCell(r + 1, 0), 'end');
            }
            setModelCursor(model, model.offsetOf(parent));
            return true;
          } else {
            if (c - 1 >= 0) {
              return focusIntegralBranch(model, parent.getCell(r, c - 1), 'end');
            }
            if (r - 1 >= 0) {
              const prevRowCols = (parent.array && parent.array[r - 1] ? parent.array[r - 1].length : cols);
              return focusIntegralBranch(model, parent.getCell(r - 1, prevRowCols - 1), 'end');
            }
            const beforeOffset = parent.leftSibling ? model.offsetOf(parent.leftSibling) : 0;
            setModelCursor(model, Math.max(0, beforeOffset));
            return true;
          }
        }

        // Caso Contenedor General (leftright, surd, genfrac, subscript, superscript, etc.)
        const curBranch = getBranchAtoms(parent, branchName);
        if (curBranch) {
          const sameBranchPh = findAdjacentPlaceholder(model, curBranch, forward);
          if (sameBranchPh) {
            setModelCursor(model, model.offsetOf(sameBranchPh));
            return true;
          }
        }

        if (forward) {
          if (parent.type === 'genfrac' && branchName === 'above' && parent.below) {
            return focusIntegralBranch(model, parent.below, 'end');
          }
          if (parent.type === 'surd' && branchName === 'above' && parent.body) {
            return focusIntegralBranch(model, parent.body, 'end');
          }
          if ((branchName === 'subscript' || branchName === 'below') && parent.superscript) {
            return focusIntegralBranch(model, parent.superscript, 'end');
          }

          // Al salir de subíndice/superíndice o denominador de derivada (\log_b(#?), \lim(#?), \sum(#?), \prod(#?), d/dx(#?)),
          // verificar si el hermano derecho inmediato contiene algún placeholder editable
          if (branchName === 'subscript' || branchName === 'superscript' || branchName === 'below' || (parent.type === 'genfrac' && branchName === 'below')) {
            let sib = parent.rightSibling;
            while (sib && sib.type === 'spacing') sib = sib.rightSibling;
            if (sib) {
              const sibPhs = collectSubtreePlaceholders([sib]);
              if (sibPhs.length > 0) {
                setModelCursor(model, model.offsetOf(sibPhs[0]));
                return true;
              }
            }
          }

          setModelCursor(model, model.offsetOf(parent));
          return true;
        } else {
          if (parent.type === 'genfrac' && branchName === 'below' && parent.above) {
            return focusIntegralBranch(model, parent.above, 'end');
          }
          if (parent.type === 'surd' && branchName === 'body' && parent.above) {
            return focusIntegralBranch(model, parent.above, 'end');
          }
          if (branchName === 'superscript' && parent.subscript) {
            return focusIntegralBranch(model, parent.subscript, 'end');
          }
          const beforeOffset = parent.leftSibling ? model.offsetOf(parent.leftSibling) : 0;
          setModelCursor(model, Math.max(0, beforeOffset));
          return true;
        }
      }

      // Nivel raíz (model.root): buscar siguiente/anterior placeholder o conservar el cursor dentro de la entrada
      const rootPh = findAdjacentPlaceholder(model, model.root?.body, forward);
      if (rootPh) {
        setModelCursor(model, model.offsetOf(rootPh));
        return true;
      }
      if (forward && curOffset < model.lastOffset) {
        setModelCursor(model, model.lastOffset);
      } else {
        focusEntryBar();
      }
      return true;
    }

    function tryIntegralArrowNav(dir) {
      if (modalNav.isOpen || selectedHistoryIndex !== -1) return false;
      const model = mf && mf._mathfield && mf._mathfield.model;
      if (!model) return false;

      const curAtom = model.at(model.position);
      if (!curAtom) return false;

      const { intAtom, integrandBox, diffBox, inSubscript, inSuperscript, isIntegrand, inDiff } = findIntegralContext(curAtom, model);
      if (!intAtom) return false;

      // Caso A: El cursor está en el LÍMITE INFERIOR (subscript)
      if (inSubscript) {
        const subBranch = intAtom.subscript || [];
        if (dir === 'up') {
          return focusIntegralBranch(model, intAtom.superscript, 'end');
        }
        if (dir === 'down') {
          return true; // Ya estamos en el límite inferior; evitar que baje o cree ramas vacías
        }
        if (dir === 'right') {
          const atRightEdge =
            model.selectionIsPlaceholder ||
            (curAtom.parent === intAtom && curAtom === subBranch[subBranch.length - 1]);
          if (atRightEdge) {
            if (integrandBox && Array.isArray(integrandBox.body)) {
              return focusIntegralBranch(model, integrandBox.body, 'start');
            }
            const integrandAtom = intAtom.rightSibling;
            if (integrandAtom && integrandAtom.type === 'placeholder') {
              setModelCursor(model, model.offsetOf(integrandAtom));
            } else {
              setModelCursor(model, model.offsetOf(intAtom));
            }
            return true;
          }
        }
        if (dir === 'left') {
          const atLeftEdge =
            model.selectionIsPlaceholder ||
            (curAtom.parent === intAtom && curAtom === subBranch[0]);
          if (atLeftEdge && intAtom.leftSibling) {
            setModelCursor(model, model.offsetOf(intAtom.leftSibling));
            return true;
          }
        }
        return false;
      }

      // Caso B: El cursor está en el LÍMITE SUPERIOR (superscript)
      if (inSuperscript) {
        const supBranch = intAtom.superscript || [];
        if (dir === 'down') {
          return focusIntegralBranch(model, intAtom.subscript, 'end');
        }
        if (dir === 'up') {
          return true; // Ya estamos en el límite superior; evitar saltar al historial REPL
        }
        if (dir === 'right') {
          const atRightEdge =
            model.selectionIsPlaceholder ||
            (curAtom.parent === intAtom && curAtom === supBranch[supBranch.length - 1]);
          if (atRightEdge) {
            if (integrandBox && Array.isArray(integrandBox.body)) {
              return focusIntegralBranch(model, integrandBox.body, 'start');
            }
            const integrandAtom = intAtom.rightSibling;
            if (integrandAtom && integrandAtom.type === 'placeholder') {
              setModelCursor(model, model.offsetOf(integrandAtom));
            } else {
              setModelCursor(model, model.offsetOf(intAtom));
            }
            return true;
          }
        }
        if (dir === 'left') {
          const atLeftEdge =
            model.selectionIsPlaceholder ||
            (curAtom.parent === intAtom && curAtom === supBranch[0]);
          if (atLeftEdge && intAtom.leftSibling) {
            setModelCursor(model, model.offsetOf(intAtom.leftSibling));
            return true;
          }
        }
        return false;
      }

      // Caso C: El cursor está al inicio o final del INTEGRANDO
      if (dir === 'left') {
        const atIntegrandBoxStart =
          integrandBox &&
          Array.isArray(integrandBox.body) &&
          (curAtom === integrandBox.body[0] || (model.selectionIsPlaceholder && curAtom === integrandBox.body[1]));
        if ((isIntegrand && (model.selectionIsPlaceholder || curAtom === intAtom.rightSibling || atIntegrandBoxStart)) && intAtom.superscript) {
          return focusIntegralBranch(model, intAtom.superscript, 'end');
        }
        if (model.selectionIsCollapsed && curAtom === intAtom && intAtom.superscript) {
          return focusIntegralBranch(model, intAtom.superscript, 'end');
        }
      }
      if (dir === 'right' && isIntegrand && integrandBox && Array.isArray(integrandBox.body) && diffBox && Array.isArray(diffBox.body)) {
        const atIntegrandRightEdge =
          (model.selectionIsPlaceholder && integrandBox.body.includes(curAtom)) ||
          (model.selectionIsCollapsed && curAtom === integrandBox.body[integrandBox.body.length - 1]);
        if (atIntegrandRightEdge) {
          return focusIntegralBranch(model, diffBox.body, 'start');
        }
      }

      // Caso D: El cursor está en el inicio del DIFERENCIAL y pulsa Flecha Izquierda (◀)
      if (dir === 'left' && inDiff && diffBox && Array.isArray(diffBox.body) && integrandBox && Array.isArray(integrandBox.body)) {
        const dAtom = diffBox.body.find((a) => isDiffSymbolAtom(a));
        const atDiffStart =
          (model.selectionIsPlaceholder && diffBox.body.includes(curAtom)) ||
          curAtom === diffBox.body[0] ||
          (model.selectionIsCollapsed && dAtom && curAtom === dAtom);
        if (atDiffStart) {
          return focusIntegralBranch(model, integrandBox.body, 'end');
        }
      }

      return false;
    }

    function tryIntegralBackspaceGuard() {
      if (modalNav.isOpen || selectedHistoryIndex !== -1) return false;
      const model = mf && mf._mathfield && mf._mathfield.model;
      if (!model) return false;
      const curAtom = model.at(model.position);
      if (!curAtom) return false;

      // Si el cursor está colapsado justo a la derecha de diffBox o integrandBox, entrar al final de la caja en lugar de desenvolverla
      if (model.selectionIsCollapsed && curAtom.type === 'box') {
        let sib = curAtom.leftSibling;
        while (sib) {
          if (sib.command === '\\int') {
            const { integrandBox: iBox, diffBox: dBox } = locateIntegralBoxes(sib);
            if (curAtom === dBox && Array.isArray(dBox.body)) {
              const dSym = dBox.body.find((a) => isDiffSymbolAtom(a));
              const lastDiffAtom = dBox.body[dBox.body.length - 1];
              if (lastDiffAtom && lastDiffAtom !== dSym) {
                setModelCursor(model, model.offsetOf(lastDiffAtom));
              } else {
                focusIntegralBranch(model, dBox.body, 'end');
              }
              return true;
            }
            if (curAtom === iBox && Array.isArray(iBox.body)) {
              focusIntegralBranch(model, iBox.body, 'end');
              return true;
            }
            break;
          }
          sib = sib.leftSibling;
        }
      }

      const { intAtom, integrandBox, diffBox, inDiff } = findIntegralContext(curAtom, model);
      if (!intAtom || !diffBox || !Array.isArray(diffBox.body)) return false;

      const dAtom = diffBox.body.find((a) => isDiffSymbolAtom(a));
      if (!dAtom) return false;

      if (inDiff) {
        if (
          model.selectionIsPlaceholder ||
          curAtom === diffBox.body[0] ||
          (model.selectionIsCollapsed && curAtom === dAtom)
        ) {
          if (!dAtom.rightSibling && typeof mf.insert === 'function') {
            mf.insert('#?', { format: 'latex', selectionMode: 'placeholder' });
            if (typeof scheduleUpdateActiveIntegralPill === 'function') {
              scheduleUpdateActiveIntegralPill();
            }
          } else if (model.selectionIsPlaceholder && integrandBox && Array.isArray(integrandBox.body)) {
            focusIntegralBranch(model, integrandBox.body, 'end');
          }
          return true;
        }
      }

      return false;
    }

    // =========================================================
    // DESPACHADOR CENTRAL DE TODAS LAS TECLAS DE LA CARCASA
    // =========================================================
    function handleHardwareKey(keyId) {
      const isCtrl = ctrlActive;
      if (keyId !== 'ctrl') {
        setCtrl(false);
      }

      switch (keyId) {
        case 'ctrl':
          setCtrl(!ctrlActive);
          return;

        case 'shift':
          if (isCtrl) {
            setShift(shiftMode === 'CAPS' ? 'OFF' : 'CAPS');
          } else {
            setShift(shiftMode === 'ONCE' ? 'OFF' : 'ONCE');
          }
          return;

        case 'esc':
          if (isCtrl) {
            if (undoStack.length > 1) {
              undoStack.pop();
              setMfLatex(undoStack[undoStack.length - 1] || '');
            } else {
              setMfLatex('');
            }
            focusEntryBar();
          } else if (modalNav.isOpen) {
            if (modalNav.onBack) modalNav.onBack();
            else closeModal();
          } else if (selectedHistoryIndex !== -1) {
            focusEntryBar();
          } else {
            setMfLatex('');
            focusEntryBar();
          }
          return;

        case 'scratchpad':
        case 'on':
        case 'doc':
        case 'tp-page-up':
        case 'tp-page-down':
        case 'tp-page-left':
        case 'tp-page-right':
        case 'flag':
          showToast('Sin acción asignada');
          return;

        case 'tab':
          if (modalNav.isOpen) {
            moveModalFocus(isCtrl ? 'up' : 'down');
            return;
          }
          handleMathTabNav(!isCtrl);
          return;

        case 'up': {
          if (isCtrl) {
            showToast('Sin acción asignada');
            return;
          }
          if (modalNav.isOpen) {
            moveModalFocus('up');
            return;
          }
          if (tryIntegralArrowNav('up')) return;
          // Si no estamos en el historial, primero intentamos subir dentro de una estructura 2D (fracción, matriz, integral)
          if (selectedHistoryIndex === -1 && getMfLatex().trim() !== '' && typeof mf.executeCommand === 'function') {
            const beforePos = mf.position;
            mf.executeCommand('moveUp');
            if (mf.position !== beforePos) {
              focusEntryBar();
              return;
            }
          }
          // Si ya estamos en el tope de la expresión 2D, subimos por el historial REPL
          if (historyRecords.length > 0) {
            if (selectedHistoryIndex === -1) selectedHistoryIndex = historyRecords.length - 1;
            else if (selectedHistoryIndex > 0) selectedHistoryIndex--;
            highlightHistoryRow();
          } else {
            focusEntryBar();
          }
          return;
        }

        case 'down': {
          if (isCtrl) {
            showToast('Sin acción asignada');
            return;
          }
          if (modalNav.isOpen) {
            moveModalFocus('down');
            return;
          }
          if (selectedHistoryIndex !== -1) {
            if (selectedHistoryIndex < historyRecords.length - 1) {
              selectedHistoryIndex++;
              highlightHistoryRow();
            } else {
              focusEntryBar();
            }
            return;
          }
          if (tryIntegralArrowNav('down')) return;
          focusEntryBar();
          if (typeof mf.executeCommand === 'function') {
            mf.executeCommand('moveDown');
          }
          return;
        }

        case 'left':
          if (isCtrl) {
            showToast('Sin acción asignada');
            return;
          }
          if (modalNav.isOpen) {
            moveModalFocus('left');
            return;
          }
          if (tryIntegralArrowNav('left')) return;
          focusEntryBar();
          if (typeof mf.executeCommand === 'function') {
            mf.executeCommand('moveToPreviousChar');
          }
          return;

        case 'right':
          if (isCtrl) {
            showToast('Sin acción asignada');
            return;
          }
          if (modalNav.isOpen) {
            moveModalFocus('right');
            return;
          }
          if (tryIntegralArrowNav('right')) return;
          focusEntryBar();
          if (typeof mf.executeCommand === 'function') {
            mf.executeCommand('moveToNextChar');
          }
          return;

        case 'center-click':
          if (modalNav.isOpen) {
            if (typeof modalNav.onKeyAction === 'function') {
              modalNav.onKeyAction('ENTER');
            } else {
              activateFocusedModalItem();
            }
            return;
          }
          if (selectedHistoryIndex >= 0 && historyRecords[selectedHistoryIndex]) {
            insertLatex(historyRecords[selectedHistoryIndex].getCopyLatex());
            selectedHistoryIndex = -1;
            highlightHistoryRow();
          } else {
            evaluateCurrentInput(false);
          }
          return;

        case 'menu':
          if (isCtrl) openContextMenuModal();
          else openMainMenuModal();
          return;

        case 'var':
          if (isCtrl) insertLatex('\\to ');
          else openVarsModal();
          return;

        case 'del':
          if (modalNav.isOpen) {
            if (typeof modalNav.onKeyAction === 'function') {
              modalNav.onKeyAction('BACKSPACE');
            } else {
              closeModal();
            }
            return;
          }
          if (isCtrl) {
            pushUndoState();
            setMfLatex('');
            focusEntryBar();
          } else {
            pushUndoState();
            focusEntryBar();
            if (!tryIntegralBackspaceGuard() && typeof mf.executeCommand === 'function') {
              mf.executeCommand('deleteBackward');
            }
          }
          return;

        case 'equals':
          if (isCtrl) openRelationsPalette();
          else insertLatex('=');
          return;

        case 'trig':
          if (isCtrl) openCatalogModal('CAT');
          else openTrigPalette();
          return;

        case 'power':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('^');
            return;
          }
          if (isCtrl) insertLatex('\\sqrt[#?]{#?}');
          else insertLatex('^{#?}');
          return;

        case 'square':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('^2');
            return;
          }
          if (isCtrl) insertLatex('\\sqrt{#?}');
          else insertLatex('^{2}');
          return;

        case 'exp':
          if (isCtrl) insertLatex('\\ln\\left(#?\\right)');
          else insertLatex('\\exponentialE^{#?}');
          return;

        case 'tenpow':
          if (isCtrl) insertLatex('\\log_{#?}\\left(#?\\right)');
          else insertLatex('10^{#?}');
          return;

        case 'lparen':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('(');
            return;
          }
          if (isCtrl) insertLatex('\\left[#?\\right]');
          else {
            const prevPairs = countMatchedPairs(collectShadowParens().parens);
            insertLatex('(');
            highlightMatchingParens('(', prevPairs);
          }
          return;

        case 'rparen':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction(')');
            return;
          }
          if (isCtrl) insertLatex('\\left\\{#?\\right\\}');
          else {
            const prevPairs = countMatchedPairs(collectShadowParens().parens);
            insertLatex(')');
            highlightMatchingParens(')', prevPairs);
          }
          return;

        case 'dot':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('.');
            return;
          }
          if (isCtrl) insertLatex(lastCapturedLatex);
          else insertLatex('.');
          return;

        case 'neg':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('-');
            return;
          }
          if (isCtrl) insertLatex('\\mathrm{Ans}');
          else insertLatex('-');
          return;

        case 'templates':
          if (isCtrl) insertLatex(':=');
          else openTemplatesPalette();
          return;

        case 'catalog':
          if (isCtrl) openCatalogModal('SYM');
          else openCatalogModal('CAT');
          return;

        case 'mul':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('*');
            return;
          }
          if (isCtrl) showToast('Sin acción asignada');
          else insertLatex('\\cdot ');
          return;

        case 'div':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('/');
            return;
          }
          if (isCtrl) insertLatex('\\frac{#0}{#?}');
          else insertLatex('\\frac{#@}{#?}');
          return;

        case 'plus':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('+');
            return;
          }
          if (isCtrl) showToast('Sin acción asignada');
          else insertLatex('+');
          return;

        case 'minus':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('-');
            return;
          }
          if (isCtrl) showToast('Sin acción asignada');
          else insertLatex('-');
          return;

        case 'enter':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('ENTER');
            return;
          }
          evaluateCurrentInput(isCtrl);
          return;

        case 'ee':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('e');
            return;
          }
          insertLatex('\\cdot 10^{#?}');
          return;

        case 'pi':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('π');
            return;
          }
          if (isCtrl) insertLatex('\\pi ');
          else openPiPalette();
          return;

        case 'comma':
          insertLatex(', ');
          return;

        case 'punct':
          openPunctPalette();
          return;

        case 'return':
          if (modalNav.isOpen && typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction('ENTER');
            return;
          }
          evaluateCurrentInput(false);
          return;

        case 'space':
          insertLatex('\\ ');
          return;
      }
    }

    // Evitar que al pulsar cualquier botón físico en pantalla táctil o ratón se pierda el foco del <math-field>
    document.querySelectorAll('.hw-btn, .tp-btn, .tp-center').forEach((el) => {
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
      });
    });

    // iPad/iPhone (Safari ignora user-scalable=no): bloquear el zoom con gestos de pellizco y doble toque
    ['gesturestart', 'gesturechange', 'gestureend'].forEach((evt) => {
      document.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
    });
    document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
    document.addEventListener(
      'touchmove',
      (e) => {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      },
      { passive: false }
    );

    // Conectar botones con data-key
    document.querySelectorAll('[data-key]').forEach((el) => {
      el.addEventListener('click', () => handleHardwareKey(el.dataset.key));
    });

    // Conectar botones numéricos 0–9 (sirven también como atajos 1–9 cuando el menú está abierto)
    document.querySelectorAll('[data-digit]').forEach((el) => {
      el.addEventListener('click', () => {
        setCtrl(false);
        const digit = el.dataset.digit;
        if (modalNav.isOpen) {
          if (typeof modalNav.onKeyAction === 'function') {
            modalNav.onKeyAction(digit);
            return;
          }
          if (typeof modalNav.onDigit === 'function') {
            modalNav.onDigit(Number(digit));
            return;
          }
          if (modalNav.mode === 'list') {
            const match = modalNav.items.find((it) => it.dataset.shortcut === digit);
            if (match) {
              match.click();
              return;
            }
          }
        }
        insertLatex(digit);
      });
    });

    // Conectar botones alfabéticos A–Z (sirven también como atajos A–D cuando el menú está abierto)
    document.querySelectorAll('[data-letter]').forEach((el) => {
      el.addEventListener('click', () => {
        setCtrl(false);
        const rawLetter = el.dataset.letter;
        if (modalNav.isOpen && modalNav.mode === 'list') {
          if (typeof modalNav.onKeyAction === 'function') {
            const ch = shiftMode !== 'OFF' ? rawLetter.toUpperCase() : rawLetter.toLowerCase();
            if (shiftMode === 'ONCE') setShift('OFF');
            modalNav.onKeyAction(ch);
            return;
          }
          const match = modalNav.items.find((it) => it.dataset.shortcut === rawLetter.toLowerCase());
          if (match) {
            match.click();
            return;
          }
        }
        const ch = shiftMode !== 'OFF' ? rawLetter.toUpperCase() : rawLetter.toLowerCase();
        if (shiftMode === 'ONCE') setShift('OFF');
        insertLatex(ch);
      });
    });

    // Soporte de teclado físico de computador (incluyendo navegación del menú, historial y plantillas 2D)
    window.addEventListener('keydown', (e) => {
      if (modalNav.isOpen) {
        if (typeof modalNav.onKeyAction === 'function') {
          if (e.key === 'Backspace') { e.preventDefault(); modalNav.onKeyAction('BACKSPACE'); return; }
          if (e.key === 'Tab') { e.preventDefault(); moveModalFocus(e.shiftKey ? 'up' : 'down'); return; }
          if (e.key === 'Enter') { e.preventDefault(); modalNav.onKeyAction('ENTER'); return; }
          if (e.key === 'ArrowDown') { e.preventDefault(); moveModalFocus('down'); return; }
          if (e.key === 'ArrowUp') { e.preventDefault(); moveModalFocus('up'); return; }
          if (e.key === 'ArrowRight') { e.preventDefault(); moveModalFocus('right'); return; }
          if (e.key === 'ArrowLeft') { e.preventDefault(); moveModalFocus('left'); return; }
          if (e.key === 'Escape') { e.preventDefault(); handleHardwareKey('esc'); return; }
          if (!e.ctrlKey && !e.metaKey && !e.altKey && /^[0-9a-zA-Z.,\-+*/^()]$/.test(e.key)) {
            e.preventDefault();
            modalNav.onKeyAction(e.key === ',' ? '.' : e.key);
            return;
          }
          return;
        }
        if (/^[1-9]$/.test(e.key) && typeof modalNav.onDigit === 'function') {
          e.preventDefault();
          modalNav.onDigit(Number(e.key));
          return;
        }
        if (modalNav.mode === 'list' && !e.ctrlKey && !e.metaKey && !e.altKey && /^[1-9a-dA-D]$/.test(e.key)) {
          const match = modalNav.items.find((it) => it.dataset.shortcut === e.key.toLowerCase());
          if (match) {
            e.preventDefault();
            match.click();
            return;
          }
        }
        if (e.key === 'Tab') { e.preventDefault(); moveModalFocus(e.shiftKey ? 'up' : 'down'); return; }
        if (e.key === 'ArrowDown') { e.preventDefault(); moveModalFocus('down'); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); moveModalFocus('up'); return; }
        if (e.key === 'ArrowRight') { e.preventDefault(); moveModalFocus('right'); return; }
        if (e.key === 'ArrowLeft') { e.preventDefault(); moveModalFocus('left'); return; }
        if (e.key === 'Enter') { e.preventDefault(); activateFocusedModalItem(); return; }
        if (e.key === 'Escape') { e.preventDefault(); handleHardwareKey('esc'); return; }
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        handleHardwareKey('up');
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        handleHardwareKey('down');
      } else if (e.key === 'ArrowLeft' && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey) {
        if (tryIntegralArrowNav('left')) {
          e.preventDefault();
          e.stopPropagation();
        }
      } else if (e.key === 'ArrowRight' && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey) {
        if (tryIntegralArrowNav('right')) {
          e.preventDefault();
          e.stopPropagation();
        }
      } else if (e.key === 'Backspace' && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey) {
        if (tryIntegralBackspaceGuard()) {
          e.preventDefault();
          e.stopPropagation();
        }
      } else if (e.key === 'Tab') {
        e.preventDefault();
        e.stopPropagation();
        handleMathTabNav(!e.shiftKey);
        return;
      }
    }, true);

    mf.addEventListener('keydown', (e) => {
      if (modalNav.isOpen) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        evaluateCurrentInput(e.ctrlKey || e.metaKey);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        handleHardwareKey('esc');
      } else if (e.key === ')' || e.key === '(') {
        const ch = e.key;
        const prevPairs = countMatchedPairs(collectShadowParens().parens);
        setTimeout(() => highlightMatchingParens(ch, prevPairs), 15);
      } else {
        clearParenHighlights();
      }
    });
  </script>
</body>
</html>
